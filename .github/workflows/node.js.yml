# Builds the Angular app and deploys it to GitHub Pages (project page).
# Live URL: https://parwejalam.github.io/portfolio/
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-${{ github.ref }}

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # legacy-peer-deps replaces the old `npm i --force`: reproducible install
      # from the lockfile while tolerating the project's peer-dep ranges.
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      # GitHub Pages has no SPA fallback. Serving index.html as 404.html makes
      # deep links (e.g. /portfolio/projects) resolve on hard refresh.
      - run: npm run deploy:404

      # Only publish on pushes to main, not on pull requests.
      - name: Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/portfolio/browser
